# Run the app in a container the same way a host would, with the SQLite file on
# a persistent volume. For normal local dev you don't need this — just use
# `npm run dev` (SQLite is a plain file, no server required).
#
#   docker compose up --build
#
# The named volume keeps prisma's database file across restarts.

services:
  app:
    build: .
    environment:
      DATABASE_URL: "file:/data/prod.db"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
    ports:
      - "3000:3000"
    volumes:
      - dbdata:/data

volumes:
  dbdata:
