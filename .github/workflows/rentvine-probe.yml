name: Rentvine API probe (one-time)

# Dumps the raw JSON shape of the Rentvine records the live property sync needs,
# so field names can be mapped exactly. Read-only; manual only. Run it once,
# copy the log output, then this workflow + script get deleted.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENTVINE_BASE_URL:   ${{ secrets.RENTVINE_BASE_URL }}
      RENTVINE_API_KEY:    ${{ secrets.RENTVINE_API_KEY }}
      RENTVINE_API_SECRET: ${{ secrets.RENTVINE_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsx scripts/rentvine-probe.ts
